
<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="./style.css">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Premium Weather App</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
rel="stylesheet">



</head>

<body>

<div class="bg1"></div>
<div class="bg2"></div>

<div class="app">

<div class="top">

<div class="logo">

<i class="fa-solid fa-cloud-sun"></i>

<h1>Weatherly</h1>

</div>

<div class="search">

<input
type="text"
placeholder="Search city..."
id="cityInput">

<button onclick="getWeather()">

<i class="fa-solid fa-search"></i>

</button>

</div>

</div>

<div class="error"
id="error"></div>

<div class="content">

<div class="left">

<div class="main-weather">

<div>

<div class="temp"
id="temp">
22°
</div>

<div class="city"
id="city">
Islamabad
</div>

<div class="desc"
id="desc">
Clear Sky
</div>

<div class="date"
id="date">
Monday, 24 June
</div>

</div>

<img
id="weatherIcon"
src="https://openweathermap.org/img/wn/01d@4x.png">

</div>

<div class="stats">

<div class="card">

<i class="fa-solid fa-droplet"></i>

<div>

<h2 id="humidity">
50%
</h2>

<p>Humidity</p>

</div>

</div>

<div class="card">

<i class="fa-solid fa-wind"></i>

<div>

<h2 id="wind">
15 km/h
</h2>

<p>Wind Speed</p>

</div>

</div>

<div class="card">

<i class="fa-solid fa-temperature-half"></i>

<div>

<h2 id="feels">
21°
</h2>

<p>Feels Like</p>

</div>

</div>

<div class="card">

<i class="fa-solid fa-gauge-high"></i>

<div>

<h2 id="pressure">
1012
</h2>

<p>Pressure</p>

</div>

</div>

</div>

</div>

<div class="right">

<div class="side-card">

<div class="side-title">
Sun Information
</div>

<div class="sun">

<div class="sun-box">

<i class="fa-solid fa-sun"></i>

<h3 id="sunrise">
6:00
</h3>

<p>Sunrise</p>

</div>

<div class="sun-box">

<i class="fa-solid fa-moon"></i>

<h3 id="sunset">
7:00
</h3>

<p>Sunset</p>

</div>

</div>

</div>

</div>

</div>

</div>

<script src="./javascript.js"></script>
</body>

</html>
